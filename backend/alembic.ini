# Alembic configuration — single source of truth for migration settings.
# Migrations themselves live under `backend/alembic/versions/` and will be
# generated in Phase 4 when the Node model lands.

[alembic]
script_location = backend/alembic
prepend_sys_path = .
sqlalchemy.url =

# We override `sqlalchemy.url` programmatically via env.py so the same
# config works in dev, test, and CI without edits.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S