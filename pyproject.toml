[project]
name = "perfect-task-tracker"
version = "0.1.0"
description = "Workspace for organizing, connecting, and visualizing tasks and ideas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PerfectTaskTracker" }]
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    # starlette<0.41 is the last branch where TestClient works without
    # httpx/httpx2. Phase 1.0 review removed httpx as speculative.
    "starlette<0.41",
    "uvicorn[standard]>=0.32.0",
    # Settings + logging
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    # Database
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.13.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    # starlette's TestClient transitively requires httpx. Keep it dev-only
    # so production runtime stays minimal (per Phase 1.0 review).
    "httpx>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]